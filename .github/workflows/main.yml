name: Build Android AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract ZIP File & Prepare Web Content
        run: |
          mkdir -p extracted
          unzip -o islamic_adhkar_app.zip -d extracted/
          mkdir -p www_clean
          HTML_FILE=$(find extracted -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "Error: No HTML file found inside ZIP!"
            exit 1
          fi
          SRC_DIR=$(dirname "$HTML_FILE")
          cp -r "$SRC_DIR"/* www_clean/
          if [ ! -f "www_clean/index.html" ]; then
            ORIGINAL_NAME=$(basename "$HTML_FILE")
            mv "www_clean/$ORIGINAL_NAME" "www_clean/index.html"
          fi

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app_project com.adhkar.app "أذكار المسلم"
          cd app_project
          rm -rf www/*
          cp -r ../www_clean/* www/

      - name: Add Android Platform
        run: |
          cd app_project
          cordova platform add android@12.0.0

      - name: Inject Google AdSense / AdMob Web Script into index.html
        run: |
          cd app_project/www
          if grep -q "cordova.js" index.html; then
            sed -i 's/<\/head>/<script async src="https:\/\/pagead2.googlesyndication.com\/pagead\/js\/adsbygoogle.js?client=ca-app-pub-1781484420727259" crossorigin="anonymous"><\/script><\/head>/g' index.html
          else
            sed -i 's/<\/head>/<script src="cordova.js"><\/script><script async src="https:\/\/pagead2.googlesyndication.com\/pagead\/js\/adsbygoogle.js?client=ca-app-pub-1781484420727259" crossorigin="anonymous"><\/script><\/head>/g' index.html
          fi

      - name: Build Android App Bundle (AAB) & APK
        run: |
          cd app_project
          cordova build android --release -- --packageType=bundle
          cordova build android --release -- --packageType=apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: app_project/platforms/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app_project/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

